    function renderSubDokumen(detail, wadah) {
        const p = detail.pendaftar;
        const jenisWajib = UI.csvKeArray(cfgPublik.JENIS_DOKUMEN_LIST);
        const jenisOpsional = UI.csvKeArray(cfgPublik.JENIS_DOKUMEN_OPSIONAL || "BUKTI_PRESTASI");
        const daftarJenis = jenisWajib.map(function (j) { return [j, false]; })
            .concat(jenisOpsional.filter(function (j) {
                return (p.PRESTASI && String(p.PRESTASI).trim()) || detail.dokumen.some(function (d) { return d.JENIS_DOKUMEN === j; });
            }).map(function (j) { return [j, true]; }));

        wadah.innerHTML = `<div class="catatan hijau">${UI.ikon("info")}<span>Dokumen bertanda <em>opsional</em> tidak memengaruhi status pendaftar. Status Diterima ditentukan oleh pembayaran.</span></div>` +
            daftarJenis.map(function (item) {
                const jenis = item[0], opsional = item[1];
                const row = detail.dokumen.find(function (d) { return d.JENIS_DOKUMEN === jenis; });
                const judul = `${UI.escapeHtml(jenis)}${opsional ? ' <span class="opsional">(opsional)</span>' : ""}`;
                if (!row || !row.FILE_URL) {
                    return `<div class="baris-dokumen"><div class="nama">${judul}</div><span class="badge abu">Belum Upload</span></div>`;
                }
                return `
                <div class="kartu">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="nama" style="font-weight:800; font-size:0.8rem;">${judul}</span>
                        <span class="badge ${row.STATUS === "Valid" ? "hijau" : (row.STATUS === "Perlu Perbaikan" ? "amber" : "biru")}">${UI.escapeHtml(row.STATUS)}</span>
                    </div>
                    <div data-dok-kartu="${UI.escapeHtml(row.DOKUMEN_ID)}">
                    <button type="button" class="tombol teks" data-buka="dokumen" data-id="${UI.escapeHtml(row.DOKUMEN_ID)}" data-lihat-dok style="padding-left:0;">Lihat berkas ${UI.ikon("panah")}</button>
                    ${row.CATATAN_PETUGAS ? `<div class="catatan-petugas">"${UI.escapeHtml(row.CATATAN_PETUGAS)}"</div>` : ""}
                    ${row.STATUS === "Valid" ? `
                        <div class="teks-kecil" style="margin-top:6px;">Dokumen terkunci untuk pendaftar. Salah tandai? Klik di bawah untuk membuka kunci agar pendaftar bisa upload ulang.</div>
                        <div style="display:flex; gap:8px; margin-top:8px;">
                            <button type="button" data-verif="${row.DOKUMEN_ID}" data-status="Perlu Perbaikan" style="flex:1;">Buka Kunci (Perlu Perbaikan)</button>
                        </div>` : `
                        <div class="teks-kecil" data-hint-dok style="margin-top:6px;">Buka berkas dulu sebelum menandai.</div>
                        <div style="display:flex; gap:8px; margin-top:8px;">
                            <button type="button" class="utama" data-verif="${row.DOKUMEN_ID}" data-status="Valid" style="flex:1;" disabled>Tandai Valid</button>
                            <button type="button" data-verif="${row.DOKUMEN_ID}" data-status="Perlu Perbaikan" style="flex:1;" disabled>Perlu Perbaikan</button>
                        </div>`}
                    </div>
                </div>`;
            }).join("");

        // Tombol penilaian baru aktif setelah berkas BENAR-BENAR berhasil dibuka
        // (sama seperti pembayaran) -> tidak ada lagi "Valid" tanpa dilihat.
        pasangTombolBuka(wadah, function (tombol) {
            if (!tombol.hasAttribute("data-lihat-dok")) return;
            const kartu = tombol.closest("[data-dok-kartu]");
            kartu.querySelectorAll("[data-verif]").forEach(function (b) { b.disabled = false; });
            const hint = kartu.querySelector("[data-hint-dok]");
            if (hint) hint.textContent = "Berkas sudah dibuka — silakan nilai.";
        });

        wadah.querySelectorAll("[data-verif]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const dokumenId = btn.getAttribute("data-verif");
                const statusBaru = btn.getAttribute("data-status");
                let catatan = "";
                if (statusBaru === "Perlu Perbaikan") {
                    const m = await modal({ judul: "Perlu Perbaikan", isiHtml: "Tulis catatan untuk pendaftar (apa yang harus diperbaiki).", input: "area", wajibIsi: true, pesanWajib: "Catatan wajib diisi.", tombolOk: "Kirim" });
                    if (!m.ok) return;
                    catatan = m.nilai.trim();
                }
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memproses…";
                try {
                    const res = await API.adminVerifikasiDokumen(dokumenId, statusBaru, catatan);
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Status dokumen diperbarui.");
                    renderDetail(true);
                } catch (err) { UI.toast(err.message || "Gagal memperbarui status.", "error"); btn.disabled = false; btn.textContent = statusBaru === "Valid" ? "Tandai Valid" : "Perlu Perbaikan"; }
            });
        });
    }

    /** Riwayat perubahan satu pendaftar (dari LOG_AKTIVITAS) — termasuk alasan pindah kelas & nilai lama -> baru. */
    async function renderSubRiwayat(detail, wadah) {
        wadah.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat riwayat…</div>';
        try {
            const res = await API.adminGetRiwayat(detail.pendaftar.NO_PENDAFTARAN);
            if (!res.ok) throw new Error(res.pesan);
            const rows = res.data.riwayat || [];
            wadah.innerHTML = rows.length ? rows.map(function (r) {
                return `<div class="kartu"><div style="display:flex; justify-content:space-between; gap:8px;"><strong style="font-size:0.78rem;">${UI.escapeHtml(r.aksi)}</strong><span class="teks-kecil">${UI.formatTanggal(r.waktu)}</span></div>
                    <div class="teks-kecil">oleh ${UI.escapeHtml(r.user || "-")} (${UI.escapeHtml(r.role || "-")})</div>
                    <div style="font-size:0.78rem; margin-top:4px; word-break:break-word;">${UI.escapeHtml(r.detail || "")}</div></div>`;
            }).join("") : '<div class="kartu teks-lembut" style="text-align:center;">Belum ada riwayat.</div>';
        } catch (err) { wadah.innerHTML = '<div class="pesan-error-umum tampil">' + UI.escapeHtml(err.message || "Gagal memuat riwayat.") + '</div>'; }
    }

    function renderSubPembayaran(detail, wadah) {
        const p = detail.pendaftar;
        const rb = detail.ringkasanBayar || {};
        const statusBayarHtml = rb.lunas ? '<span class="badge hijau">Lunas — Diterima</span>' : (rb.total > 0 ? '<span class="badge amber">Menunggu Daftar Ulang</span>' : '<span class="badge abu">Belum ada pembayaran</span>');

        wadah.innerHTML = `
            <div class="kartu">
                <div class="bagian-judul">Ringkasan Biaya</div>
                <div class="baris-info"><span>Biaya pendaftaran (${UI.escapeHtml(p.JENIS_KELAMIN || "-")})</span><span>${UI.formatRupiah(rb.biaya || 0)}</span></div>
                <div class="baris-info"><span>Potongan${rb.keteranganPotongan ? " — " + UI.escapeHtml(rb.keteranganPotongan) : ""}</span><span>${rb.potongan ? "- " + UI.formatRupiah(rb.potongan) : "-"}</span></div>
                <div class="baris-info"><span>Yang harus dibayar</span><span>${UI.formatRupiah(rb.ambang || 0)}</span></div>
                <div class="baris-info"><span>Sudah dibayar (terkonfirmasi)</span><span>${UI.formatRupiah(rb.total || 0)}</span></div>
                <div class="baris-info"><span>Sisa</span><span style="color:${rb.sisa ? "var(--merah)" : "var(--hijau-700)"};">${UI.formatRupiah(rb.sisa || 0)}</span></div>
                <div style="margin-top:8px;">${statusBayarHtml}</div>
            </div>

            <div class="kartu">
                <div class="bagian-judul">Potongan Biaya</div>
                ${rb.potongan ? `<div class="baris-info"><span>Potongan saat ini</span><span>${UI.formatRupiah(rb.potongan)}${rb.keteranganPotongan ? " — " + UI.escapeHtml(rb.keteranganPotongan) : ""}</span></div>` : '<p class="teks-lembut" style="margin:0 0 8px;">Belum ada potongan untuk pendaftar ini.</p>'}
                <p class="teks-lembut" style="margin:8px 0;">Isi nominal POSITIF untuk mengganti potongan di atas (kosongkan/isi 0 untuk menghapusnya). Maksimal sebesar biaya pendaftaran (${UI.formatRupiah(rb.biaya)}).</p>
                <div class="grid-2">
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Nominal Potongan Baru</label><input type="number" inputmode="numeric" id="fPotongan" value="" min="0" max="${rb.biaya}" placeholder="0"></div>
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Keterangan</label><input type="text" id="fKetPotongan" value="" placeholder="Beasiswa / Anak Guru / Anak Panti / Gel. 1"></div>
                </div>
                <div class="pesan-error-umum" id="errorPotongan"></div>
                <button type="button" class="blok" id="btnSimpanPotongan" style="margin-top:8px;">Simpan Potongan</button>
            </div>

            <div class="kartu">
                <div class="bagian-judul">Catat Pembayaran Langsung</div>
                <div class="grid-2">
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Jenis</label><select id="fJenisBayar"><option>DP</option><option>Daftar Ulang</option></select></div>
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Metode</label><select id="fMetodeBayar"><option>Tunai</option><option>Transfer</option></select></div>
                </div>
                <div class="field"><label style="margin-top:6px; font-size:0.72rem;">Nominal</label><input type="text" inputmode="numeric" id="fNominalBayar" placeholder="mis. 100000"></div>
                <div class="pesan-error-umum" id="errorCatatBayar"></div>
                <button type="button" class="utama blok" id="btnCatatBayar" style="margin-top:8px;">Catat &amp; Konfirmasi</button>
            </div>

            <div class="bagian-judul" style="margin-top:14px;">Riwayat Pembayaran</div>
            <div id="daftarBayar"></div>
        `;

        document.getElementById("btnSimpanPotongan").addEventListener("click", async function (e) {
            const btn = e.currentTarget, eb = document.getElementById("errorPotongan");
            eb.classList.remove("tampil");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.adminSetPotongan(p.NO_PENDAFTARAN, document.getElementById("fPotongan").value, document.getElementById("fKetPotongan").value);
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Potongan disimpan.");
                renderDetail(true);
            } catch (err) { eb.textContent = err.message || "Gagal."; eb.classList.add("tampil"); btn.disabled = false; btn.textContent = "Simpan Potongan"; }
        });

        document.getElementById("fNominalBayar").addEventListener("input", function (e) {
            const bersih = e.target.value.replace(/\D/g, "");
            if (bersih !== e.target.value) e.target.value = bersih;
        });
        document.getElementById("btnCatatBayar").addEventListener("click", async function (e) {
            const btn = e.currentTarget, eb = document.getElementById("errorCatatBayar");
            eb.classList.remove("tampil");
            // CEK SEBELUM KIRIM: angka harus masuk akal & tidak melebihi sisa tagihan,
            // lalu minta konfirmasi dengan nominal tertulis jelas (mencegah salah ketik 12.500.000 vs 1.250.000).
            const nominalAngka = parseInt(document.getElementById("fNominalBayar").value || "0", 10);
            if (!nominalAngka || nominalAngka <= 0) { eb.textContent = "Isi nominal pembayaran (angka)."; eb.classList.add("tampil"); return; }
            if (rb.ambang > 0 && nominalAngka > (rb.sisa || 0)) {
                eb.textContent = "Nominal " + UI.formatRupiah(nominalAngka) + " melebihi sisa tagihan " + UI.formatRupiah(rb.sisa || 0) + ". Periksa kembali angka yang diketik.";
                eb.classList.add("tampil"); return;
            }
            const konf = await modal({
                judul: "Konfirmasi Pembayaran",
                isiHtml: `Catat pembayaran <strong style="font-size:1.1rem;">${UI.formatRupiah(nominalAngka)}</strong> (${UI.escapeHtml(document.getElementById("fJenisBayar").value)}, ${UI.escapeHtml(document.getElementById("fMetodeBayar").value)}) untuk <strong>${UI.escapeHtml(p.NAMA_LENGKAP)}</strong>?<br><br>Sisa tagihan setelah ini: <strong>${UI.formatRupiah(Math.max(0, (rb.sisa || 0) - nominalAngka))}</strong>. Pastikan angkanya benar.`,
                tombolOk: "Ya, Catat",
            });
            if (!konf.ok) return;
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Mencatat…";
            try {
                const res = await API.adminInputPembayaran(p.NO_PENDAFTARAN, document.getElementById("fJenisBayar").value, document.getElementById("fMetodeBayar").value, document.getElementById("fNominalBayar").value);
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Pembayaran tercatat & terkonfirmasi.");
                renderDetail(true);
            } catch (err) { eb.textContent = err.message || "Gagal."; eb.classList.add("tampil"); btn.disabled = false; btn.textContent = "Catat & Konfirmasi"; }
        });

        const daftar = document.getElementById("daftarBayar");
        if (detail.pembayaran.length === 0) {
            daftar.innerHTML = '<div class="kartu teks-lembut" style="text-align:center;">Belum ada pembayaran tercatat.</div>';
            return;
        }
        daftar.innerHTML = detail.pembayaran.map(function (b) {
            const menunggu = b.STATUS_KONFIRMASI === "Menunggu";
            const perluBukti = String(b.METODE) !== "Tunai";
            const adaBukti = !!b.BUKTI_URL;
            return `
            <div class="kartu" data-bayar-kartu="${b.PAYMENT_ID}" data-perlu-bukti="${perluBukti && adaBukti ? "1" : "0"}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:800; font-size:0.8rem;">${UI.escapeHtml(b.JENIS)} · ${UI.escapeHtml(b.METODE)}</span>
                    <span style="font-weight:800; color:var(--hijau-700);">${UI.formatRupiah(b.NOMINAL)}</span>
                </div>
                <div class="teks-kecil">${UI.formatTanggal(b.TANGGAL)}</div>
                ${adaBukti ? `<button type="button" class="tombol teks" data-buka="bukti" data-id="${UI.escapeHtml(b.PAYMENT_ID)}" data-lihat-bukti style="padding-left:0;">Lihat bukti ${UI.ikon("panah")}</button>` : (perluBukti ? '<div class="catatan amber" style="margin:6px 0;">' + UI.ikon("info") + '<span>Transfer ini belum ada bukti — belum bisa dikonfirmasi.</span></div>' : '<div class="teks-kecil">Tanpa bukti (tunai).</div>')}
                <span class="badge ${b.STATUS_KONFIRMASI === "Dikonfirmasi" ? "hijau" : (b.STATUS_KONFIRMASI === "Ditolak" ? "merah" : "amber")}" style="display:inline-block; margin-top:4px;">${UI.escapeHtml(b.STATUS_KONFIRMASI)}</span>
                ${isAdmin() ? `<button type="button" class="tombol teks" data-koreksi="${UI.escapeHtml(b.PAYMENT_ID)}" style="padding-left:0; display:block;">Koreksi data pembayaran (admin)</button>` : ""}
                ${menunggu ? `
                    <div class="field"><label style="margin-top:8px; font-size:0.72rem;">Nominal (koreksi jika salah ketik)</label><input type="text" inputmode="numeric" data-nominal value="${UI.escapeHtml(String(b.NOMINAL || "").replace(/\D/g, ""))}"></div>
                    ${perluBukti && adaBukti ? '<div class="teks-kecil" data-hint-bukti style="margin-top:6px;">Buka bukti dulu sebelum mengonfirmasi.</div>' : ""}
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <button type="button" class="utama" data-konfirmasi="${b.PAYMENT_ID}" style="flex:1;" ${(perluBukti && !adaBukti) || (perluBukti && adaBukti) ? "disabled" : ""}>Konfirmasi</button>
                        <button type="button" data-tolak="${b.PAYMENT_ID}" style="flex:1;">Tolak</button>
                    </div>` : ""}
            </div>`;
        }).join("");

        // Tombol Konfirmasi baru aktif setelah bukti BENAR-BENAR berhasil dibuka
        pasangTombolBuka(daftar, function (tombol) {
            if (!tombol.hasAttribute("data-lihat-bukti")) return;
            const kartu = tombol.closest("[data-bayar-kartu]");
            const btn = kartu.querySelector("[data-konfirmasi]");
            if (btn) btn.disabled = false;
            const hint = kartu.querySelector("[data-hint-bukti]");
            if (hint) hint.textContent = "Bukti sudah dibuka — silakan konfirmasi jika sesuai.";
        });

        daftar.querySelectorAll("[data-konfirmasi]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const kartu = btn.closest("[data-bayar-kartu]");
                const nominal = kartu.querySelector("[data-nominal]").value;
                const nominalAngka = parseInt(String(nominal).replace(/\D/g, "") || "0", 10);
                if (!nominalAngka) { UI.toast("Nominal harus lebih dari 0.", "error"); return; }
                if (rb.ambang > 0 && nominalAngka > (rb.sisa || 0)) { UI.toast("Nominal " + UI.formatRupiah(nominalAngka) + " melebihi sisa tagihan " + UI.formatRupiah(rb.sisa || 0) + ". Koreksi angkanya dulu.", "error"); return; }
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memproses…";
                try {
                    const res = await API.adminKonfirmasiPembayaran(btn.getAttribute("data-konfirmasi"), "Dikonfirmasi", "", nominal);
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Pembayaran dikonfirmasi.");
                    renderDetail(true);
                } catch (err) { UI.toast(err.message || "Gagal.", "error"); btn.disabled = false; btn.textContent = "Konfirmasi"; }
            });
        });
        daftar.querySelectorAll("[data-koreksi]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const b = detail.pembayaran.find(function (x) { return x.PAYMENT_ID === btn.getAttribute("data-koreksi"); });
                if (b) bukaFormKoreksiBayar(b, rb);
            });
        });
        daftar.querySelectorAll("[data-tolak]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const m = await modal({ judul: "Tolak Pembayaran", isiHtml: "Tulis alasan penolakan.", input: "area", wajibIsi: true, pesanWajib: "Alasan wajib diisi.", tombolOk: "Tolak" });
                if (!m.ok) return;
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memproses…";
                try {
                    const res = await API.adminKonfirmasiPembayaran(btn.getAttribute("data-tolak"), "Ditolak", m.nilai.trim());
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Pembayaran ditolak.");
                    renderDetail(true);
                } catch (err) { UI.toast(err.message || "Gagal.", "error"); btn.disabled = false; btn.textContent = "Tolak"; }
            });
        });
    }

    /** [ADMIN] Form koreksi pembayaran yang salah input (nominal/jenis/metode), dengan batas kelebihan bayar. */
    function bukaFormKoreksiBayar(b, rb) {
        const nominalSkrg = parseInt(String(b.NOMINAL || "0").replace(/\D/g, ""), 10) || 0;
        // Yang boleh diisi maksimal = sisa tagihan + nominal baris ini (kalau sudah terkonfirmasi)
        const maks = b.STATUS_KONFIRMASI === "Dikonfirmasi" ? (rb.sisa || 0) + nominalSkrg : null;
        const latar = document.createElement("div");
        latar.className = "modal-latar";
        latar.innerHTML = `<div class="modal-kotak">
            <h3 style="margin:0 0 8px;">Koreksi Pembayaran</h3>
            <div class="teks-kecil">Tercatat: ${UI.formatRupiah(nominalSkrg)} · ${UI.escapeHtml(b.JENIS)} · ${UI.escapeHtml(b.METODE)}${maks !== null && rb.ambang > 0 ? ` · nominal maksimal yang bisa diisi: ${UI.formatRupiah(maks)}` : ""}</div>
            <label>Nominal (angka)</label><input type="text" inputmode="numeric" id="kNominal" value="${nominalSkrg}">
            <label>Jenis</label><select id="kJenis"><option>DP</option><option>Daftar Ulang</option></select>
            <label>Metode</label><select id="kMetode"><option>Tunai</option><option>Transfer</option></select>
            <div class="pesan-error-umum" id="kError"></div>
            <div style="display:flex; gap:8px; margin-top:14px;">
                <button type="button" id="kBatal" style="flex:1;">Batal</button>
                <button type="button" class="utama" id="kSimpan" style="flex:1;">Simpan Koreksi</button>
            </div></div>`;
        document.body.appendChild(latar);
        latar.querySelector("#kJenis").value = b.JENIS; latar.querySelector("#kMetode").value = b.METODE;
        latar.querySelector("#kNominal").addEventListener("input", function (e) { const bersih = e.target.value.replace(/\D/g, ""); if (bersih !== e.target.value) e.target.value = bersih; });
        latar.querySelector("#kBatal").addEventListener("click", function () { latar.remove(); });
        latar.querySelector("#kSimpan").addEventListener("click", async function () {
            const eb = latar.querySelector("#kError"); eb.classList.remove("tampil");
            const nominalBaru = parseInt(latar.querySelector("#kNominal").value || "0", 10);
            if (!nominalBaru) { eb.textContent = "Nominal harus lebih dari 0."; eb.classList.add("tampil"); return; }
            if (maks !== null && rb.ambang > 0 && nominalBaru > maks) { eb.textContent = "Nominal " + UI.formatRupiah(nominalBaru) + " melebihi batas " + UI.formatRupiah(maks) + "."; eb.classList.add("tampil"); return; }
            const btn = latar.querySelector("#kSimpan"); btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.adminEditPembayaran(b.PAYMENT_ID, { nominal: String(nominalBaru), jenisPembayaran: latar.querySelector("#kJenis").value, metode: latar.querySelector("#kMetode").value });
                if (!res.ok) throw new Error(res.pesan);
                UI.toast(res.pesan || "Pembayaran dikoreksi."); latar.remove(); renderDetail(true);
            } catch (err) { eb.textContent = err.message || "Gagal menyimpan."; eb.classList.add("tampil"); btn.disabled = false; btn.textContent = "Simpan Koreksi"; }
        });
    }

    // -----------------------------------------------------------------
    // PENGUMUMAN (Bagian 11)
    // -----------------------------------------------------------------
    async function renderPengumuman() {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat pengumuman…</div>';
        try {
            const res = await API.adminGetPengumuman();
            const rows = (res.ok && res.data && res.data.pengumuman) ? res.data.pengumuman : [];

            isiTab.innerHTML = `
                <button type="button" class="utama blok" id="btnBuatPengumuman">Buat Pengumuman Baru</button>
                <div id="formPengumuman" style="display:none; margin-top:12px;"></div>
                <h3 style="margin-top:18px;">Semua Pengumuman</h3>
                <div class="catatan hijau">${UI.ikon("info")}<span>Yang nonaktif tidak tampil ke pendaftar tetapi tetap bisa dilihat di sini dan diaktifkan lagi.</span></div>
                ${rows.length === 0 ? '<div class="kartu teks-lembut" style="text-align:center;">Belum ada pengumuman.</div>' :
                    rows.map(function (r) {
                        const aktif = String(r.AKTIF) === "Ya";
                        return `<div class="kartu" style="${aktif ? "" : "opacity:.65;"}" data-aktif="${aktif ? "Ya" : "Tidak"}" data-id="${UI.escapeHtml(r.PENGUMUMAN_ID)}" data-judul="${UI.escapeHtml(r.JUDUL)}" data-isi="${UI.escapeHtml(r.ISI || "")}" data-link="${UI.escapeHtml(r.LINK_WA || "")}" data-target="${UI.escapeHtml(r.TARGET_GELOMBANG || "")}">
                            <div style="display:flex; justify-content:space-between; gap:8px;">
                                <div style="font-weight:800;">${UI.escapeHtml(r.JUDUL)}</div>
                                <span style="display:flex; gap:4px;">${aktif ? "" : '<span class="badge merah">Nonaktif</span>'}${r.TARGET_GELOMBANG ? `<span class="badge biru">Gel. ${UI.escapeHtml(r.TARGET_GELOMBANG)}</span>` : `<span class="badge abu">Semua</span>`}</span>
                            </div>
                            <p class="teks-lembut" style="margin:4px 0;">${UI.escapeHtml(r.ISI || "")}</p>
                            ${r.LINK_WA ? `<a href="${UI.escapeHtml(r.LINK_WA)}" target="_blank" rel="noreferrer" class="tombol teks" style="padding-left:0;">${UI.ikon("panah")} Buka Link</a>` : ""}
                            <div style="display:flex; gap:8px; margin-top:8px;">
                                <button type="button" class="tombol teks" data-aksi-edit style="padding-left:0;">Edit</button>
                                ${aktif ? '<button type="button" class="tombol teks" data-aksi-nonaktif style="padding-left:0; color:var(--merah);">Nonaktifkan</button>' : '<button type="button" class="tombol teks" data-aksi-aktifkan style="padding-left:0;">Aktifkan lagi</button>'}
                            </div>
                        </div>`;
                    }).join("")}
            `;

            document.getElementById("btnBuatPengumuman").addEventListener("click", function () { bukaFormPengumuman(null, "", "", "", ""); });
            wadahEventPengumuman();
        } catch (err) {
            isiTab.innerHTML = '<div class="pesan-error-umum tampil">Error jaringan: ' + UI.escapeHtml(err.message) + '</div>';
        }
    }

    function wadahEventPengumuman() {
        document.querySelectorAll("[data-aksi-edit]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const kartu = btn.closest("[data-id]");
                bukaFormPengumuman(kartu.getAttribute("data-id"), kartu.getAttribute("data-judul"), kartu.getAttribute("data-isi"), kartu.getAttribute("data-link"), kartu.getAttribute("data-target"));
            });
        });
        document.querySelectorAll("[data-aksi-nonaktif]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const kartu = btn.closest("[data-id]");
                if (!confirm("Nonaktifkan pengumuman ini?")) return;
                try {
                    const res = await API.adminSimpanPengumuman(kartu.getAttribute("data-id"), kartu.getAttribute("data-judul"), kartu.getAttribute("data-isi"), "Tidak", kartu.getAttribute("data-link"), kartu.getAttribute("data-target"));
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Pengumuman dinonaktifkan.");
                    renderPengumuman();
                } catch (err) { UI.toast(err.message || "Gagal.", "error"); }
            });
        });
    }

    document.addEventListener("click", async function (e) {
        const btn = e.target.closest && e.target.closest("[data-aksi-aktifkan]");
        if (!btn) return;
        const kartu = btn.closest("[data-id]");
        btn.disabled = true;
        try {
            const res = await API.adminSimpanPengumuman(kartu.getAttribute("data-id"), kartu.getAttribute("data-judul"), kartu.getAttribute("data-isi"), "Ya", kartu.getAttribute("data-link"), kartu.getAttribute("data-target"));
            if (!res.ok) throw new Error(res.pesan);
            UI.toast("Pengumuman diaktifkan lagi.");
            renderPengumuman();
        } catch (err) { UI.toast(err.message || "Gagal.", "error"); btn.disabled = false; }
    });

    function bukaFormPengumuman(id, judul, isi, link, targetGelombang) {
        const wadah = document.getElementById("formPengumuman");
        wadah.style.display = "block";
        const opsiTarget = [["", "Semua Gelombang"], ["1", "Gelombang 1"], ["2", "Gelombang 2"], ["3", "Gelombang 3"], ["Khusus", "Gelombang Khusus"]];
        wadah.innerHTML = `
            <div class="kartu">
                <label style="margin-top:0;">Judul</label>
                <input type="text" id="fJudulPengumuman" maxlength="100" value="${UI.escapeHtml(judul)}">
                <label>Isi <span class="opsional">(maks. 500 karakter, satu paragraf tanpa Enter)</span></label>
                <textarea id="fIsiPengumuman" rows="4" maxlength="500">${UI.escapeHtml(isi)}</textarea>
                <div class="teks-kecil" id="hitungIsi" style="text-align:right;"></div>
                <label>Link <span class="opsional">(opsional — link apa saja: grup WA, formulir, web sekolah, dll)</span></label>
                <input type="text" id="fLinkPengumuman" value="${UI.escapeHtml(link || "")}" placeholder="https://...">
                <label>Ditujukan untuk <span class="opsional">(biarkan "Semua" kalau tidak perlu dipilah)</span></label>
                <select id="fTargetPengumuman">${opsiTarget.map(function (o) { return `<option value="${o[0]}" ${o[0] === (targetGelombang || "") ? "selected" : ""}>${o[1]}</option>`; }).join("")}</select>
                <div class="pesan-error-umum" id="errorPengumuman"></div>
                <button type="button" class="utama blok" id="btnSimpanPengumuman" style="margin-top:10px;">Simpan</button>
            </div>
        `;
        const taIsi = document.getElementById("fIsiPengumuman");
        const hitung = function () { document.getElementById("hitungIsi").textContent = taIsi.value.length + " / 500"; };
        taIsi.addEventListener("keydown", function (e) { if (e.key === "Enter") e.preventDefault(); });
        taIsi.addEventListener("input", function () { const bersih = taIsi.value.replace(/[\r\n]+/g, " "); if (bersih !== taIsi.value) taIsi.value = bersih; hitung(); });
        taIsi.value = taIsi.value.replace(/[\r\n]+/g, " ");
        hitung();
        // Pindahkan tampilan ke form supaya pengguna tahu form edit sudah terbuka.
        wadah.scrollIntoView({ behavior: "smooth", block: "start" });
        document.getElementById("fJudulPengumuman").focus({ preventScroll: true });

        document.getElementById("btnSimpanPengumuman").addEventListener("click", async function () {
            const j = document.getElementById("fJudulPengumuman").value.trim();
            const i = document.getElementById("fIsiPengumuman").value.trim();
            const lk = document.getElementById("fLinkPengumuman").value.trim();
            const tg = document.getElementById("fTargetPengumuman").value;
            const errorBox = document.getElementById("errorPengumuman");
            errorBox.classList.remove("tampil");
            if (!j) { errorBox.textContent = "Judul wajib diisi."; errorBox.classList.add("tampil"); return; }
            if (i.length > 500) { errorBox.textContent = "Isi maksimal 500 karakter."; errorBox.classList.add("tampil"); return; }
            if (lk && lk.indexOf("https://") !== 0) { errorBox.textContent = "Link harus diawali https://"; errorBox.classList.add("tampil"); return; }
            const btn = document.getElementById("btnSimpanPengumuman");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.adminSimpanPengumuman(id, j, i, "Ya", lk, tg);
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Pengumuman tersimpan.");
                renderPengumuman();
            } catch (err) {
                errorBox.textContent = err.message || "Gagal menyimpan.";
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Simpan";
            }
        });
    }

    // -----------------------------------------------------------------
    // PENGATURAN (admin saja) — editor CONFIG satu-per-satu (Bagian 12)
    // -----------------------------------------------------------------
    function renderPengaturan() {
        if (!isAdmin()) { viewAktif = "beranda"; render(); return; }
        const isiTab = document.getElementById("isiTab");
        const keyUmum = [
            "STATUS_PENDAFTARAN_DIBUKA", "TAHUN_AJARAN", "TAHUN_AJARAN_PENDEK",
            "BIAYA_PENDAFTARAN_L", "BIAYA_PENDAFTARAN_P", "BIAYA_DP_MIN", "KELAS_PEMINATAN_LIST",
            "WA_TEMPLATE_HUBUNGI_PENDAFTAR", "JENIS_DOKUMEN_OPSIONAL", "REKENING_1", "REKENING_2",
            "ADMIN_WA_1_NAMA", "ADMIN_WA_1_NOMOR", "ADMIN_WA_2_NAMA", "ADMIN_WA_2_NOMOR",
            "FORM_TUTUP_JUDUL", "FORM_TUTUP_SUBJUDUL", "FORM_TUTUP_INFO_TAMBAHAN",
            "FITUR_SURVEI_AKTIF",
        ];
        const keteranganKey = {
            STATUS_PENDAFTARAN_DIBUKA: 'Isi persis salah satu: Ya / Offline / Tidak. "Ya" = semua bisa daftar & login. "Offline" = pendaftar baru ditolak, pendaftar lama & petugas/admin tetap bisa. "Tidak" = cuma admin yang bisa login.',
            TAHUN_AJARAN: 'Teks bebas untuk ditampilkan ke pendaftar, contoh: 2026/2027.',
            TAHUN_AJARAN_PENDEK: '4 digit, dipakai di depan No. Pendaftaran, contoh: 2627.',
            BIAYA_PENDAFTARAN_L: 'Angka saja tanpa titik/Rp, contoh: 1750000. Biaya pendaftaran untuk JENIS_KELAMIN diawali "Laki".',
            BIAYA_PENDAFTARAN_P: 'Angka saja tanpa titik/Rp, contoh: 1800000. Biaya pendaftaran untuk JENIS_KELAMIN diawali "Perempuan".',
            BIAYA_DP_MIN: 'Angka saja, contoh: 100000. Minimal DP yang disarankan (tidak memblokir submit kalau kurang).',
            KELAS_PEMINATAN_LIST: 'Daftar kelas dipisah koma, TANPA spasi setelah koma, contoh: Reguler,Tahfidz,Unggulan.',
            WA_TEMPLATE_HUBUNGI_PENDAFTAR: 'Teks pesan WA ke pendaftar. Boleh pakai {nama_pendaftar}, {no_pendaftaran}, {kelas_peminatan} — huruf besar/kecil sama saja, otomatis diganti.',
            JENIS_DOKUMEN_OPSIONAL: 'Daftar jenis dokumen TAMBAHAN dipisah koma (selain yang wajib), contoh: BUKTI_PRESTASI.',
            REKENING_1: 'Format WAJIB: nama_bank,no_rek,atas_nama (dipisah koma, tanpa spasi di no_rek). Contoh: BANK MANDIRI,111222333555,Sinta Malihah. Hanya no_rek yang tersalin otomatis. Kosongkan kalau belum ada.',
            REKENING_2: 'Rekening alternatif kedua (opsional), format sama seperti REKENING_1.',
            ADMIN_WA_1_NAMA: 'Nama admin yang tampil di tombol WA, contoh: Admin SPMB.',
            ADMIN_WA_1_NOMOR: 'WAJIB format 628xxxxxxxxxx (awali 62, BUKAN 0) — kalau diawali 0 tombol WA tidak akan berfungsi.',
            ADMIN_WA_2_NAMA: 'Sama seperti ADMIN_WA_1_NAMA, untuk admin kedua (opsional).',
            ADMIN_WA_2_NOMOR: 'Sama seperti ADMIN_WA_1_NOMOR, format 628xxxxxxxxxx.',
            FORM_TUTUP_JUDUL: 'Judul besar di halaman form_tutup.html saat pendaftaran ditutup.',
            FORM_TUTUP_SUBJUDUL: 'Sub-judul/penjelasan singkat di halaman form_tutup.html.',
            FORM_TUTUP_INFO_TAMBAHAN: 'Info tambahan opsional di halaman form_tutup.html, mis. kapan dibuka lagi.',
            FITUR_SURVEI_AKTIF: 'Isi persis: Ya atau Tidak. Mengaktif/nonaktifkan kartu survei di halaman sukses.',
        };
        isiTab.innerHTML = `
            <div class="kartu">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                    <div class="bagian-judul" style="margin:0;">Kelola User (Petugas/Admin)</div>
                    <button type="button" class="utama" id="btnTambahUser" style="padding:6px 12px; font-size:0.78rem;">+ Tambah</button>
                </div>
                <div id="daftarUser" class="teks-lembut" style="margin-top:10px;">Memuat…</div>
                <p class="teks-kecil" style="margin:8px 0 0;">Password &amp; PIN tidak pernah ditampilkan; saat mengubah, kosongkan untuk tidak mengganti. User yang dinonaktifkan tidak bisa login baru (sesi yang sudah berjalan berakhir maksimal 6 jam).</p>
            </div>
            <div class="catatan amber">${UI.ikon("info")}<span>Hanya key CONFIG umum yang ditampilkan di sini. Key rahasia (SELF_CHECK_KEY, DRIVE_*_FOLDER_ID) sengaja tidak bisa diedit lewat dashboard — ubah langsung dari Google Sheet CONFIG kalau perlu.</span></div>
            <div class="kartu">
                <label style="margin-top:0;">Pilih Key CONFIG</label>
                <select id="fPilihKey">${keyUmum.map(function (k) { return `<option value="${k}">${k}</option>`; }).join("")}</select>
                <div class="teks-kecil" id="keteranganKey" style="margin-top:6px; color:var(--tinta-lembut);"></div>
                <label>Nilai Saat Ini</label>
                <input type="text" id="fNilaiSekarang" disabled>
                <label>Nilai Baru</label>
                <input type="text" id="fNilaiBaru">
                <div class="pesan-error-umum" id="errorConfig"></div>
                <button type="button" class="utama blok" id="btnSimpanConfig" style="margin-top:10px;">Simpan Perubahan</button>
            </div>
            <div class="kartu">
                <div class="bagian-judul">Bersihkan Riwayat Aktivitas</div>
                <p class="teks-lembut" style="margin:0 0 10px;">Hapus log lama agar Spreadsheet tidak membengkak. Log yang lebih baru tetap disimpan. Tindakan ini tidak bisa dibatalkan.</p>
                <div style="display:grid; gap:8px;">
                    <button type="button" data-hari="60">Hapus log lebih dari 60 hari</button>
                    <button type="button" data-hari="90">Hapus log lebih dari 90 hari</button>
                    <button type="button" data-hari="180">Hapus log lebih dari 180 hari</button>
                </div>
            </div>
        `;
        document.querySelectorAll("[data-hari]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const hari = btn.getAttribute("data-hari");
                const m = await modal({
                    judul: "Hapus Log " + hari + " Hari",
                    isiHtml: "Semua riwayat aktivitas yang lebih lama dari <strong>" + hari + " hari</strong> akan dihapus permanen. Ketik <strong>HAPUS</strong> untuk melanjutkan.",
                    input: "teks", placeholder: "Ketik HAPUS", wajibKata: "HAPUS", tombolOk: "Hapus Log",
                });
                if (!m.ok) return;
                const teksAsal = btn.textContent;
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menghapus…";
                try {
                    const res = await API.adminBersihkanLog(hari, "HAPUS");
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast(res.pesan);
                } catch (err) { UI.toast(err.message || "Gagal menghapus log.", "error"); }
                btn.disabled = false; btn.textContent = teksAsal;
            });
        });
        async function muatUser() {
            const box = document.getElementById("daftarUser");
            try {
                const res = await API.adminGetUsers();
                if (!res.ok) throw new Error(res.pesan);
                const users = res.data.users || [];
                box.innerHTML = users.length ? users.map(function (u) {
                    return `<div class="baris-info" style="align-items:center; gap:8px;">
                        <span style="flex:1; min-width:0;"><strong>${UI.escapeHtml(u.nama)}</strong><br><span class="teks-kecil">${UI.escapeHtml(u.email)} · ${UI.escapeHtml(u.role)}</span></span>
                        <span class="badge ${u.statusAktif === "Ya" ? "hijau" : "amber"}">${u.statusAktif === "Ya" ? "Aktif" : "Nonaktif"}</span>
                        <button type="button" data-edit-user="${UI.escapeHtml(u.userId)}" style="padding:4px 10px; font-size:0.72rem;">Ubah</button>
                    </div>`;
                }).join("") : "Belum ada user.";
                box.querySelectorAll("[data-edit-user]").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        bukaFormUser(users.filter(function (u) { return u.userId === btn.getAttribute("data-edit-user"); })[0]);
                    });
                });
            } catch (err) { box.textContent = err.message || "Gagal memuat user."; }
        }
        function bukaFormUser(u) {
            const baru = !u; u = u || { userId: "", nama: "", email: "", role: "petugas", statusAktif: "Ya" };
            const latar = document.createElement("div");
            latar.className = "modal-latar";
            latar.innerHTML = `<div class="modal-kotak">
                <h3 style="margin:0 0 8px;">${baru ? "Tambah User" : "Ubah User"}</h3>
                <label style="margin-top:0;">Nama</label><input type="text" id="uNama" value="${UI.escapeHtml(u.nama)}">
                <label>Email (dipakai login)</label><input type="text" id="uEmail" value="${UI.escapeHtml(u.email)}" autocomplete="off">
                <label>Password ${baru ? "(min. 6 karakter)" : "(kosongkan = tidak diganti)"}</label><input type="text" id="uPassword" autocomplete="off">
                <label>PIN 6 digit ${baru ? "" : "(kosongkan = tidak diganti)"}</label><input type="text" id="uPin" inputmode="numeric" maxlength="6" autocomplete="off">
                <label>Role</label><select id="uRole"><option value="petugas">petugas</option><option value="admin">admin</option></select>
                <label>Status</label><select id="uStatus"><option value="Ya">Aktif</option><option value="Tidak">Nonaktif</option></select>
                <div class="pesan-error-umum" id="uError"></div>
                <div style="display:flex; gap:8px; margin-top:14px;">
                    <button type="button" id="uBatal" style="flex:1;">Batal</button>
                    <button type="button" class="utama" id="uSimpan" style="flex:1;">Simpan</button>
                </div></div>`;
            document.body.appendChild(latar);
            latar.querySelector("#uRole").value = u.role; latar.querySelector("#uStatus").value = u.statusAktif;
            latar.querySelector("#uBatal").addEventListener("click", function () { latar.remove(); });
            latar.querySelector("#uSimpan").addEventListener("click", async function () {
                const eb = latar.querySelector("#uError"); eb.classList.remove("tampil");
                const btn = latar.querySelector("#uSimpan");
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
                try {
                    const res = await API.adminSimpanUser({
                        userId: u.userId,
                        nama: latar.querySelector("#uNama").value, email: latar.querySelector("#uEmail").value,
                        password: latar.querySelector("#uPassword").value, pin: latar.querySelector("#uPin").value,
                        role: latar.querySelector("#uRole").value, statusAktif: latar.querySelector("#uStatus").value,
                    });
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast(res.pesan); latar.remove(); muatUser();
                } catch (err) {
                    eb.textContent = err.message || "Gagal menyimpan."; eb.classList.add("tampil");
                    btn.disabled = false; btn.textContent = "Simpan";
                }
            });
        }
        document.getElementById("btnTambahUser").addEventListener("click", function () { bukaFormUser(null); });
        muatUser();

        const selKey = document.getElementById("fPilihKey");
        function isiNilaiSekarang() {
            document.getElementById("fNilaiSekarang").value = cfgPublik[selKey.value] || "(kosong)";
            document.getElementById("keteranganKey").textContent = keteranganKey[selKey.value] || "";
        }
        selKey.addEventListener("change", isiNilaiSekarang);
        isiNilaiSekarang();

        document.getElementById("btnSimpanConfig").addEventListener("click", async function () {
            const key = selKey.value;
            const value = document.getElementById("fNilaiBaru").value;
            const errorBox = document.getElementById("errorConfig");
            errorBox.classList.remove("tampil");
            if (!value) { errorBox.textContent = "Nilai baru wajib diisi."; errorBox.classList.add("tampil"); return; }
            const btn = document.getElementById("btnSimpanConfig");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.adminUpdateConfig(key, value);
                if (!res.ok) throw new Error(res.pesan);
                cfgPublik[key] = value;
                UI.toast("CONFIG." + key + " berhasil diperbarui.");
                document.getElementById("fNilaiBaru").value = "";
                isiNilaiSekarang();
                btn.disabled = false; btn.textContent = "Simpan Perubahan";
            } catch (err) {
                errorBox.textContent = err.message || "Gagal menyimpan.";
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Simpan Perubahan";
            }
        });
    }

    mulai();
</script>
</body>
</html>
